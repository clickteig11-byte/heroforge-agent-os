<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HeroForge V1 — Light-Mode Editorial Motion Graphics (60s @ 30fps)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #F6F4EF;
    }
    canvas {
      display: block;
      width: 1920px;
      height: 1080px;
    }
  </style>
</head>
<body>
  <canvas id="motion-stage" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('motion-stage');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Preloaded Image Registry
    window.__LOADED_IMAGES = {};
    window.__loadImages = async function(imgMap) {
      const entries = Object.entries(imgMap);
      await Promise.all(entries.map(([key, src]) => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { window.__LOADED_IMAGES[key] = img; resolve(); };
        img.onerror = () => resolve();
        img.src = src;
      })));
      await document.fonts.ready;
    };

    // Math & Easing Helpers for 30fps Motion Graphics
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOutExpo = (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const easeOutBack = (x) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };
    const spring = (x) => {
      const c = clamp(x, 0, 1);
      return 1 - Math.exp(-6.5 * c) * Math.cos(9.5 * c);
    };

    // Rounded Rectangle Helper
    function roundRect(x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    // Draw Image with Cover & Parallax Zoom/Pan
    function drawCoverImage(imgKey, x, y, w, h, radius, zoom = 1.0, panX = 0, panY = 0) {
      ctx.save();
      roundRect(x, y, w, h, radius);
      ctx.clip();
      const img = window.__LOADED_IMAGES[imgKey];
      if (img && img.width > 0) {
        const scale = Math.max(w / img.width, h / img.height) * zoom;
        const dw = img.width * scale;
        const dh = img.height * scale;
        const dx = x + (w - dw) * 0.5 + panX;
        const dy = y + (h - dh) * 0.5 + panY;
        ctx.drawImage(img, dx, dy, dw, dh);
      } else {
        ctx.fillStyle = '#E5E0D5';
        ctx.fillRect(x, y, w, h);
      }
      ctx.restore();
    }

    // Draw Pill Badge
    function drawPill(x, y, text, bg, fg, border, fontSize = 14, padX = 18, padY = 9) {
      ctx.save();
      ctx.font = `600 ${fontSize}px "JetBrains Mono", monospace`;
      const tw = ctx.measureText(text).width;
      const w = tw + padX * 2;
      const h = fontSize + padY * 2;
      roundRect(x, y, w, h, h / 2);
      ctx.fillStyle = bg;
      ctx.fill();
      if (border) {
        ctx.strokeStyle = border;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.fillStyle = fg;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + padX, y + h / 2 + 1);
      ctx.restore();
      return w;
    }

    // Masked Kinetic Text Line Reveal
    function drawKineticLine(text, x, y, font, color, progress, slideDist = 56) {
      const p = easeOutExpo(clamp(progress, 0, 1));
      if (p <= 0.001) return;
      ctx.save();
      ctx.font = font;
      const metrics = ctx.measureText(text);
      const h = 115;
      ctx.beginPath();
      ctx.rect(x - 20, y - h + 18, metrics.width + 80, h + 20);
      ctx.clip();
      ctx.globalAlpha = clamp(progress * 1.8, 0, 1);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y + (1 - p) * slideDist);
      ctx.restore();
    }

    // Draw Custom Animated Cursor + Click Ripple
    function drawCursorAndRipple(cx, cy, clickProgress = 0, label = '') {
      ctx.save();
      if (clickProgress > 0 && clickProgress < 1) {
        const r = lerp(6, 54, easeOutCubic(clickProgress));
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(9, 105, 218, ${1 - clickProgress})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 26);
      ctx.lineTo(7, 20);
      ctx.lineTo(13, 31);
      ctx.lineTo(18, 28);
      ctx.lineTo(12, 17);
      ctx.lineTo(21, 17);
      ctx.closePath();
      ctx.fillStyle = '#141413';
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (label) {
        ctx.font = '600 12px "JetBrains Mono", monospace';
        roundRect(22, 14, ctx.measureText(label).width + 24, 28, 14);
        ctx.fillStyle = '#0969DA';
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(label, 34, 32);
      }
      ctx.restore();
    }

    // Draw Swiss Architectural Grid & Animated Crosshairs (Light Mode Foundation)
    function drawSwissLightBackground(t) {
      // Warm Museum Paper Base
      const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
      grad.addColorStop(0, '#F8F6F1');
      grad.addColorStop(0.5, '#F4F1EA');
      grad.addColorStop(1, '#EFECE4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1920, 1080);

      // Soft Moving Ambient Sunlight Gradient Orbs (Light Mode Depth)
      const orb1X = 400 + Math.sin(t * 0.35) * 180;
      const orb1Y = 260 + Math.cos(t * 0.25) * 90;
      const rad1 = ctx.createRadialGradient(orb1X, orb1Y, 20, orb1X, orb1Y, 640);
      rad1.addColorStop(0, 'rgba(212, 163, 115, 0.14)');
      rad1.addColorStop(1, 'rgba(212, 163, 115, 0)');
      ctx.fillStyle = rad1;
      ctx.fillRect(0, 0, 1920, 1080);

      const orb2X = 1480 + Math.cos(t * 0.3) * 160;
      const orb2Y = 740 + Math.sin(t * 0.4) * 110;
      const rad2 = ctx.createRadialGradient(orb2X, orb2Y, 20, orb2X, orb2Y, 620);
      rad2.addColorStop(0, 'rgba(9, 105, 218, 0.08)');
      rad2.addColorStop(1, 'rgba(9, 105, 218, 0)');
      ctx.fillStyle = rad2;
      ctx.fillRect(0, 0, 1920, 1080);

      // Subtle Scrolling Swiss Structural Grid Lines
      ctx.save();
      const driftX = (t * 18) % 160;
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.045)';
      ctx.lineWidth = 1;
      for (let x = -160 + driftX; x < 1920; x += 160) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1080);
        ctx.stroke();
      }
      for (let y = 120; y < 1080; y += 160) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1920, y);
        ctx.stroke();
      }

      // Rotating Precision Crosshairs at Key Grid Intersections
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.16)';
      for (let gx = 160; gx <= 1760; gx += 320) {
        for (let gy = 120; gy <= 960; gy += 320) {
          ctx.save();
          ctx.translate(gx, gy);
          ctx.rotate(t * 0.45);
          ctx.beginPath();
          ctx.moveTo(-6, 0);
          ctx.lineTo(6, 0);
          ctx.moveTo(0, -6);
          ctx.lineTo(0, 6);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // Draw Top & Bottom Editorial Framing Chrome
    function drawEditorialHUD(t, actLabel) {
      ctx.save();
      // Top Pill Bar in Light Mode
      roundRect(56, 28, 620, 44, 22);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Pulsing Cobalt Status Dot
      const pulse = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.beginPath();
      ctx.arc(82, 50, 5 + pulse * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0969DA';
      ctx.fill();

      ctx.font = '700 13px "JetBrains Mono", monospace';
      ctx.fillStyle = '#141413';
      ctx.fillText('HEROFORGE V1 · AUTONOMOUS CREATIVE STUDIO & AGENT OS', 100, 55);

      // Right Telemetry Pill
      roundRect(1260, 28, 604, 44, 22);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.12)';
      ctx.stroke();

      ctx.font = '600 13px "JetBrains Mono", monospace';
      ctx.fillStyle = '#57534E';
      ctx.fillText(actLabel, 1284, 55);

      const sec = Math.floor(t);
      const ms = Math.floor((t % 1) * 30);
      const tc = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}:${String(ms).padStart(2, '0')}`;
      ctx.fillStyle = '#0969DA';
      ctx.fillText(tc, 1764, 55);

      // Bottom Timeline Scrubber Track
      ctx.fillStyle = 'rgba(20, 20, 19, 0.08)';
      ctx.fillRect(56, 1052, 1808, 6);
      const progW = clamp(t / 60.0, 0, 1) * 1808;
      const barGrad = ctx.createLinearGradient(56, 0, 56 + progW, 0);
      barGrad.addColorStop(0, '#0969DA');
      barGrad.addColorStop(0.5, '#A66E38');
      barGrad.addColorStop(1, '#15803D');
      ctx.fillStyle = barGrad;
      ctx.fillRect(56, 1052, progW, 6);

      // Continuous High-Speed Light-Mode Kinetic Ticker Ribbon (Moves 160px every second!)
      ctx.save();
      roundRect(56, 1004, 1808, 36, 18);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.clip();

      const tickerText = '01 AETHERION GENÈVE (B− → A+)   ·   02 KUROKAWA & VANE (B → A+)   ·   03 VALKYR ORBITAL (A+)   ·   04 SORA & KLANG (A+)   ·   05 ATELIER VESPERS (A+)   ·   06 VELOCE MORPHOS (A+)   ·   07 SOLARIS LENSWORKS (A+)   ·   38 CONSOLIDATED SKILLS   ·   HERMES & CODEX CLI   ·   OBSIDIAN VAULT   ·   ';
      ctx.font = '700 12px "JetBrains Mono", monospace';
      ctx.fillStyle = '#141413';
      const tw = ctx.measureText(tickerText).width;
      const tickerOffset = -((t * 175) % tw);
      ctx.fillText(tickerText, 72 + tickerOffset, 1026);
      ctx.fillText(tickerText, 72 + tickerOffset + tw, 1026);
      ctx.restore();

      // Chapter Tick Marks on Scrubber
      const chapters = [0, 8, 17, 26, 35, 47, 54.5, 60];
      chapters.forEach((ch) => {
        const cx = 56 + (ch / 60) * 1808;
        ctx.fillStyle = t >= ch ? '#141413' : 'rgba(20, 20, 19, 0.25)';
        ctx.fillRect(cx - 1, 1048, 2, 14);
      });
      ctx.restore();
    }

    // Draw a Full Mini A+ Hero Card with Live Parallax & Callouts
    function drawShowcaseHeroCard(x, y, w, h, cfg, t, localT) {
      ctx.save();
      roundRect(x + 4, y + 12, w, h, 24);
      ctx.fillStyle = 'rgba(20, 20, 19, 0.08)';
      ctx.fill();
      roundRect(x, y, w, h, 24);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // Inner Photo with Continuous Smooth Ken Burns Zoom & Pan Every Second
      const zoom = 1.04 + 0.08 * Math.sin(t * 0.95) + (localT * 0.012);
      const panX = Math.cos(t * 1.15) * 28;
      const panY = Math.sin(t * 0.9) * 16;
      drawCoverImage(cfg.imgKey, x + 10, y + 10, w - 20, h - 20, 18, zoom, panX, panY);

      // Subtle Editorial Scrim at Bottom-Left so Typography Pops
      ctx.save();
      roundRect(x + 10, y + 10, w - 20, h - 20, 18);
      ctx.clip();
      const scrim = ctx.createLinearGradient(x, y + h * 0.25, x, y + h);
      scrim.addColorStop(0, 'rgba(15, 14, 13, 0.05)');
      scrim.addColorStop(1, 'rgba(15, 14, 13, 0.76)');
      ctx.fillStyle = scrim;
      ctx.fillRect(x + 10, y + 10, w - 20, h - 20);

      // Top Floating Pill Navbar inside Hero Card
      const navW = Math.min(w - 80, 520);
      const navX = x + (w - navW) / 2;
      const navY = y + 28 + (1 - spring(norm(localT, 0.05, 0.6))) * -30;
      roundRect(navX, navY, navW, 42, 21);
      ctx.fillStyle = 'rgba(20, 19, 18, 0.76)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '700 12px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#FCFAF6';
      ctx.fillText(cfg.navBrand, navX + 20, navY + 25);

      ctx.font = '500 12px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = 'rgba(252, 250, 246, 0.82)';
      const links = cfg.navLinks || ['Movement', 'Craft', 'Specifications'];
      links.forEach((l, i) => {
        ctx.fillText(l, navX + 150 + i * 86, navY + 25);
      });

      roundRect(navX + navW - 88, navY + 6, 80, 30, 15);
      ctx.fillStyle = '#FCFAF6';
      ctx.fill();
      ctx.font = '600 11px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#171513';
      ctx.fillText(cfg.navCta || 'Inquire', navX + navW - 66, navY + 25);

      // Bottom-Left Restrained Editorial Stack
      const baseX = x + 44;
      const baseY = y + h - 42;

      // 1. Small Quiet Eyebrow
      ctx.font = '600 12px "JetBrains Mono", monospace';
      ctx.fillStyle = cfg.accent || '#E9D5B5';
      ctx.fillText(cfg.eyebrow, baseX, baseY - 178);

      // 2. Intentional 2-Line Balanced Headline
      ctx.font = '400 52px "Cormorant Garamond", Georgia, serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(cfg.line1, baseX, baseY - 122);
      ctx.font = 'italic 400 52px "Cormorant Garamond", Georgia, serif';
      ctx.fillStyle = '#F5E6CE';
      ctx.fillText(cfg.line2, baseX, baseY - 68);

      // 3. Single Primary CTA Pill
      roundRect(baseX, baseY - 40, 196, 40, 20);
      ctx.fillStyle = '#FCFAF6';
      ctx.fill();
      ctx.font = '600 13px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#171513';
      ctx.fillText(cfg.cta, baseX + 24, baseY - 15);

      // 4. Right Quiet Caption
      if (cfg.caption) {
        ctx.font = '500 11px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(252, 250, 246, 0.82)';
        const cw = ctx.measureText(cfg.caption).width;
        ctx.fillText(cfg.caption, x + w - cw - 44, baseY - 14);
      }

      ctx.restore();
      ctx.strokeStyle = 'rgba(20, 20, 19, 0.14)';
      ctx.lineWidth = 1.5;
      roundRect(x, y, w, h, 24);
      ctx.stroke();
      ctx.restore();
    }

    // =========================================================================
    // MASTER 60-SECOND (1,800 FRAME) LIGHT-MODE MOTION GRAPHICS RENDERER
    // =========================================================================
    window.__setRenderTime = function(rawT) {
      const t = clamp(rawT, 0, 60.0);
      drawSwissLightBackground(t);

      // -----------------------------------------------------------------------
      // ACT 1 (0.0s -> 8.0s): POSTER FRAME & KINETIC EDITORIAL HOOK
      // Note: Frame 0 (t = 0.0) is baked at full visibility for the Poster Frame!
      // -----------------------------------------------------------------------
      if (t < 8.5) {
        const exitP = norm(t, 7.2, 8.5);
        const offsetX = -easeInOutCubic(exitP) * 1960;
        ctx.save();
        ctx.translate(offsetX, 0);

        drawEditorialHUD(t, 'ACT 01 / DESIGN RESTRAINT, ENGINEERED (B− → A+)');

        // Left Editorial Typography Column (Visible at t=0 for Poster, with kinetic motion accents)
        const introBoost = t === 0 ? 1 : clamp(0.85 + 0.15 * spring(norm(t, 0, 0.9)), 0, 1);
        drawPill(72, 126, 'HEROFORGE V1 · LIGHT-MODE EDITORIAL MOTION FILM', '#FFFFFF', '#0969DA', 'rgba(9,105,218,0.3)', 13, 18, 8);

        drawKineticLine('From Template', 72, 250, '600 92px "Cormorant Garamond", serif', '#141413', introBoost, 30);
        drawKineticLine('Clutter to A+', 72, 344, 'italic 600 92px "Cormorant Garamond", serif', '#A66E38', introBoost, 30);
        drawKineticLine('Restraint.', 72, 438, '600 92px "Cormorant Garamond", serif', '#141413', introBoost, 30);

        ctx.font = '400 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#44403C';
        ctx.fillText('We took a real B / B− critique on our Watch & Architecture heroes,', 72, 502);
        ctx.fillText('stripped competing cards & orphan words, consolidated 38 skills,', 72, 534);
        ctx.fillText('and built 7 A+ Flagship Websites + our Slate & Limestone Agent OS.', 72, 566);

        // Animated Live Score Counter Cards in Light Mode
        const scoreCount = t === 0 ? 99.4 : lerp(78.0, 99.4, easeOutCubic(norm(t, 0.4, 3.2)));
        const cards = [
          { label: 'WATCH HERO GRADE', before: 'B−', after: 'A+', metric: `${scoreCount.toFixed(1)} pts`, color: '#15803D' },
          { label: 'ARCHITECTURE GRADE', before: 'B', after: 'A+', metric: '2-Line Lock', color: '#0969DA' },
          { label: 'FLAGSHIP SITES BUILT', before: '2', after: '7', metric: '7 Full Prompts', color: '#A66E38' },
        ];
        cards.forEach((c, idx) => {
          const cx = 72 + idx * 246;
          const cy = 616 + Math.sin(t * 2.2 + idx) * 4;
          roundRect(cx, cy, 230, 134, 18);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.strokeStyle = 'rgba(20, 20, 19, 0.12)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.font = '600 11px "JetBrains Mono", monospace';
          ctx.fillStyle = '#78716C';
          ctx.fillText(c.label, cx + 20, cy + 32);

          ctx.font = '700 36px "Plus Jakarta Sans", sans-serif';
          ctx.fillStyle = c.color;
          ctx.fillText(`${c.before} → ${c.after}`, cx + 20, cy + 78);

          ctx.font = '600 13px "JetBrains Mono", monospace';
          ctx.fillStyle = '#141413';
          ctx.fillText(c.metric, cx + 20, cy + 110);
        });

        // Right-Hand Floating Dual Hero Showcase Plates with Continuous Dynamic Motion Every Second
        const card1X = 860 + Math.cos(t * 1.4) * 14;
        const card1Y = 104 + Math.sin(t * 2.1) * 16;
        const card2X = 860 - Math.cos(t * 1.4) * 14;
        const card2Y = 534 + Math.cos(t * 2.1) * 16;
        drawShowcaseHeroCard(card1X, card1Y, 988, 404, {
          imgKey: 's1',
          navBrand: 'AETHERION',
          navLinks: ['Movement', 'Craft', 'Specifications'],
          navCta: 'Inquire',
          eyebrow: '01 · CALIBRE 01 · GENEVA (WATCH HERO: B− → A+)',
          line1: 'German silver, shaped',
          line2: 'by morning light.',
          cta: 'Explore the Movement',
          caption: '312 PARTS · 96H RESERVE',
          accent: '#E9D5B5',
        }, t, t + 1);

        drawShowcaseHeroCard(card2X, card2Y, 988, 404, {
          imgKey: 's2',
          navBrand: 'KUROKAWA & VANE',
          navLinks: ['Projects', 'Studio', 'Materials'],
          navCta: 'Inquire',
          eyebrow: '02 · REYKJANES PAVILION (ARCHITECTURE HERO: B → A+)',
          line1: 'Carved from silence',
          line2: 'and volcanic stone.',
          cta: 'View Project',
          caption: '01 REYKJANES · 02 NAOSHIMA · 03 ATACAMA',
          accent: '#D4A373',
        }, t + 2, t + 1);

        // Choreographed Cursor Gliding Across Act 1 Cards
        const c1X = lerp(920, 1580, 0.5 + 0.5 * Math.sin(t * 1.3));
        const c1Y = lerp(260, 740, 0.5 + 0.5 * Math.cos(t * 1.7));
        drawCursorAndRipple(c1X, c1Y, (t * 1.4) % 1, 'Verify A+ Hero Restraint');

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // ACT 2 (7.2s -> 17.5s): INTERACTIVE "DE-SLOP SURGERY" (CRITIQUE FIX IN MOTION)
      // Shows the exact B/B- flaws being surgically redlined & fixed in real time!
      // -----------------------------------------------------------------------
      if (t >= 7.2 && t < 17.5) {
        const enterP = norm(t, 7.2, 8.5);
        const exitP = norm(t, 16.2, 17.5);
        const localT = t - 8.0;
        const posX = (1 - easeInOutCubic(enterP)) * 1960 - easeInOutCubic(exitP) * 1960;

        ctx.save();
        ctx.translate(posX, 0);
        drawEditorialHUD(t, 'ACT 02 / THE MINIMALIST HERO RESTRAINT SURGERY');

        drawPill(72, 110, 'LIVE CRITIQUE TRANSFORMATION · STRIPPING AI TEMPLATE CLUTTER', '#FFFFFF', '#A66E38', 'rgba(166,110,56,0.35)', 13, 18, 8);
        drawKineticLine('How We Turned a B− Template', 72, 206, '600 68px "Cormorant Garamond", serif', '#141413', norm(localT, -0.3, 0.6), 40);
        drawKineticLine('into an A+ Minimalist Showcase.', 72, 278, 'italic 600 68px "Cormorant Garamond", serif', '#0969DA', norm(localT, 0.0, 0.9), 40);

        // 4 Animated Surgery Cards Showing Real-Time Redline & Fix
        const rules = [
          {
            num: 'FIX 01 · HEADLINE WRAPPING',
            title: 'Eliminate Stranded Orphan Words',
            bad: 'German silver, shaped by morning / [light.]  ← Orphaned on Line 3',
            good: 'Line 1: German silver, shaped  |  Line 2: by morning light.',
            status: '2-LINE LOCK VERIFIED',
          },
          {
            num: 'FIX 02 · INTERFACE JARGON',
            title: 'Replace Decorative AI Labels with Human Words',
            bad: '“Practice Bento” · “Lithic Archive” · “Switch Residence Plate”',
            good: '“Projects” · “Studio” · “Materials” · “[Inquire]”',

        ctx.fillText('MULTI-ENGINE CLI CONSOLES · HERMES + CODEX CLI + OPENDESIGN GRADER', 132, 674);

        const cliLogs = [
          '$ hermes dispatch --workflow heroforge-a-plus-loop --sites 7 --skills 38',
          '✓ [OpenDesign] Watch Hero (B− → A+) & Architecture Hero (B → A+) verified',
          '$ codex exec -s danger-full-access "Synthesize high-res hero plates 03–07"',
          '✓ [Skill Sync] 38 skills consolidated into heroforge-master-studio/SKILL.md',
          '✓ [Deploy] Live on GitHub & Vercel (clickteig11-byte/heroforge-agent-os)',
        ];
        cliLogs.forEach((l, i) => {
          ctx.font = '500 16px "JetBrains Mono", monospace';
          ctx.fillStyle = l.startsWith('$') ? '#0969DA' : '#15803D';
          ctx.fillText(l, 132, 722 + i * 46);
        });

        // Right-Hand Live Side-View Canvas Inside Agent OS
        drawShowcaseHeroCard(956, 194, 864, 786, {
          imgKey: 's1',
          navBrand: 'AETHERION',
          navLinks: ['Movement', 'Craft', 'Specifications'],
          navCta: 'Inquire',
          eyebrow: 'SIDE-VIEW LIVE CANVAS · COLOR ISOLATED FROM WORKSPACE',
          line1: 'German silver, shaped',
          line2: 'by morning light.',
          cta: 'Explore the Movement',
          caption: 'GRADE A+ · 0 ORPHANS · 1 CTA',
          accent: '#E9D5B5',
        }, t, localT);

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // ACT 7 (53.6s -> 60.0s): GRAND FINALE — 7-SITE LIGHT-MODE MOSAIC & LOCKUP
      // -----------------------------------------------------------------------
      if (t >= 53.6) {
        const enterP = norm(t, 53.6, 54.9);
        const localT = t - 54.5;
        ctx.save();
        ctx.globalAlpha = easeInOutCubic(enterP);

        drawEditorialHUD(t, 'ACT 07 / HEROFORGE V1 · 7 FLAGSHIP WEBSITES · 38 SKILLS · GRADE A+');

        // Center Kinetic Finale Lockup
        drawPill(690, 108, 'HEROFORGE V1 · AUTONOMOUS CREATIVE STUDIO COMPLETE', '#FFFFFF', '#0969DA', 'rgba(9,105,218,0.35)', 13, 20, 8);
        drawKineticLine('Seven Flagship Worlds.', 72, 214, '600 84px "Cormorant Garamond", serif', '#141413', norm(localT, -0.2, 0.6), 36);
        drawKineticLine('One Minimalist Law.', 960, 214, 'italic 600 84px "Cormorant Garamond", serif', '#A66E38', norm(localT, 0.0, 0.8), 36);

        // 7-Card Moving Light-Mode Mosaic Grid
        const mosaic = [
          { idx: '01', name: 'Aetherion Genève', sub: 'B− → A+ Watch Vitrine', img: 's1' },
          { idx: '02', name: 'Kurokawa & Vane', sub: 'B → A+ Architecture', img: 's2' },
          { idx: '03', name: 'Valkyr Orbital', sub: 'A+ Hall-Effect Propulsion', img: 's3' },
          { idx: '04', name: 'Sora & Klang', sub: 'A+ Acoustic Monolith', img: 's4' },
          { idx: '05', name: 'Atelier Vespers', sub: 'A+ Botanical Apothecary', img: 's5' },
          { idx: '06', name: 'Veloce Morphos', sub: 'A+ Carbon Hyper-GT', img: 's6' },
          { idx: '07', name: 'Solaris Lensworks', sub: 'A+ APO Cinema Optics', img: 's7' },
        ];

        mosaic.forEach((m, i) => {
          const row = i < 4 ? 0 : 1;
          const col = i < 4 ? i : i - 4;
          const cardW = row === 0 ? 432 : 584;
          const cardH = 330;
          const cx = 72 + col * (cardW + 24);
          const cy = 264 + row * 362 + Math.sin(t * 2 + i * 0.8) * 5;

          roundRect(cx, cy, cardW, cardH, 20);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.strokeStyle = 'rgba(20,20,19,0.12)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          drawCoverImage(m.img, cx + 8, cy + 8, cardW - 16, cardH - 84, 14, 1.04 + 0.03 * Math.sin(t + i), 0, 0);

          ctx.font = '700 12px "JetBrains Mono", monospace';
          ctx.fillStyle = '#0969DA';
          ctx.fillText(`${m.idx} · GRADE A+`, cx + 20, cy + cardH - 46);

          ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
          ctx.fillStyle = '#141413';
          ctx.fillText(m.name, cx + 20, cy + cardH - 18);

          ctx.font = '500 13px "Plus Jakarta Sans", sans-serif';
          ctx.fillStyle = '#78716C';
          const sw = ctx.measureText(m.sub).width;
          ctx.fillText(m.sub, cx + cardW - sw - 20, cy + cardH - 20);
        });

        ctx.restore();
      }
    };
  </script>
